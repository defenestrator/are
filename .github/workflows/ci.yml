name: CI

# Development CI runs on the EDOS-Engineering/are fork. defenestrator/are is
# the deployment repository: when the fork's main passes CI, deploy-sync
# fast-forwards defenestrator/are main to the tested commit, and Forge deploys
# from there. A sync copies this file across too, so the sync job is guarded
# to the fork and the test jobs double as a pre-deploy check upstream.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Pest and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: ./vendor/bin/pest

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # Production runs on PostgreSQL 14, so the suite runs there as well. The DB_*
  # variables come from the job environment. phpunit.xml sets DB_CONNECTION
  # and DB_DATABASE without force="true", and PHPUnit only applies such an
  # <env> when the variable is not already set, so the job's values win. That
  # keeps a single phpunit.xml. The last step checks that the run really
  # reached Postgres, so a later force="true" cannot quietly send this job
  # back to SQLite.
  tests-pgsql:
    name: Pest on PostgreSQL 14
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: are_test
          POSTGRES_USER: are
          POSTGRES_PASSWORD: are
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U are -d are_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: are_test
      DB_USERNAME: are
      DB_PASSWORD: are
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, mbstring, intl
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: ./vendor/bin/pest

      - name: Confirm the suite ran on Postgres
        env:
          PGPASSWORD: are
        run: |
          applied=$(psql -h 127.0.0.1 -U are -d are_test -Atc 'select count(*) from migrations')
          echo "Migrations applied on Postgres: $applied"
          test "$applied" -gt 0

  # Unit tests for browser modules that have no dependencies (node:test), so
  # no npm install is needed. Currently the visualizer's audio source logic.
  js:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: node --test
        run: npm run test:js

  # The single required status check (ruleset protecc-main). Add every job
  # that must pass to `needs`; the ruleset never has to change.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [tests, tests-pgsql, js]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "A required job did not succeed:"; echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'; exit 1; }

  deploy-sync:
    name: Sync tested main to defenestrator/are
    if: github.repository == 'EDOS-Engineering/are' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-gate]
    runs-on: ubuntu-latest
    # Never let two syncs race; an older commit cannot overwrite a newer one
    # anyway, because the push below is fast-forward only.
    concurrency:
      group: deploy-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SYNC_KEY }}

      - name: Fast-forward defenestrator/are main to the tested commit
        run: |
          git remote add deploy git@github.com:defenestrator/are.git
          git fetch deploy main
          if ! git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA"; then
            echo "::error::defenestrator/are main has commits the fork lacks. Bring them into the fork through a PR; this job never force-pushes."
            exit 1
          fi
          git push deploy "$GITHUB_SHA:refs/heads/main"
